<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Monitoramento</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <h1 class="titulo text-center mb-5">
            CENTRAL DE MONITORAMENTO - UNIDADE 04
        </h1>

        <div class="card painel">

            <div class="card-body text-center">

                <h2>SISTEMA HIDRÁULICO</h2>

                <span id="statusBadge" class="badge bg-secondary mb-3">
                    AGUARDANDO
                </span>

                <div id="displayPressao" class="display-digital">
                    0.0 BAR
                </div>

                <p class="mt-3">
                    Última sincronização:
                    <span id="ultimaAtualizacao">
                        --
                    </span>
                </p>

                <div id="loadingSpinner"
                    class="spinner-border text-warning d-none mt-3">
                </div>

                <div class="progress mt-4">

                    <div id="barraPressao"
                        class="progress-bar bg-success"
                        style="width:0%">
                        0%
                    </div>

                </div>

            </div>

        </div>

        <div id="mensagemErro"
            class="alert alert-danger mt-4 d-none">
        </div>

        <div class="text-center mt-4">

            <button onclick="monitorarPressao()"
                class="btn btn-primary btn-lg">
                SINCRONIZAR SENSOR
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
